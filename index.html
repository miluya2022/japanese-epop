  if(!state.data)return;header();
  document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===state.page||(state.page==='quiz'&&b.dataset.page==='home'));b.setAttribute('aria-current',b.classList.contains('active')?'page':'false');});
  const view={home:homeView,words:wordsView,stats:statsView,settings:settingsView,quiz:quizView,summary:summaryView}[state.page]||homeView;
  const markup=view(),existing=$('main').querySelector?.('.quiz-layout');
  if(state.page==='quiz'&&existing&&document.createRange){
    // Keep the actual form and input mounted: replacing a focused input dismisses mobile keyboards.
    const replacement=document.createRange().createContextualFragment(markup).querySelector('.quiz-layout');
    const form=existing.querySelector('.quiz-answer'),nextForm=replacement.querySelector('.quiz-answer');
    for(const selector of ['.quiz-top','.progress-track','.quiz-question','.quiz-help','.quiz-controls'])existing.querySelector(selector).replaceWith(replacement.querySelector(selector));
    form.querySelector('label').textContent=nextForm.querySelector('label').textContent;
    const input=form.querySelector('input'),source=nextForm.querySelector('input');
    input.className=source.className;input.placeholder=source.placeholder;
    input.setAttribute('enterkeyhint',source.getAttribute('enterkeyhint'));
    input.setAttribute('aria-busy',source.getAttribute('aria-busy'));
    input.value=source.value;
    form.querySelector('.answer-status').textContent=nextForm.querySelector('.answer-status').textContent;
    form.querySelector('.answer-status').className=nextForm.querySelector('.answer-status').className;
  }else $('main').innerHTML=markup;
  document.body.classList.toggle('quiz-mode',state.page==='quiz');if(state.page==='quiz'&&state.feedback&&state.keepKeyboard)$('answer-input')?.focus({preventScroll:true});
  if(state.page==='quiz'&&!state.feedback){const input=$('answer-input');if(input){input.value=state.draft.answer||'';if(window.innerWidth>600||state.keepKeyboard)input.focus({preventScroll:true});}}
}

function loadDraft(){state.submittedAnswer='';const q=state.session?.queue[state.session.index];const key=q?state.session.id+':'+q.id:'';let draft={};try{draft=JSON.parse(readLocal('jepop-draft')||'{}');}catch(e){}state.draft=draft.key===key?draft:{key,answer:'',hints:0,revealed:false,assistedAudio:false};}
function saveDraft(){writeLocal('jepop-draft',JSON.stringify(state.draft));}
function zhHtml(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<mark class="target">$1</mark>');}
function sentenceHtml(text,blank=true){
  const tokens=String(text).split(/(\{[^|}]+\|[^}]+\}|(?:お|ご)?[\u3400-\u9fff々〆ヵヶ][\u3400-\u9fff々〆ヵヶぁ-ゖ]*\[[^\]]+\])/g);
  return tokens.map(t=>{let m=t.match(/^\{([^|}]+)\|([^}]+)\}$/);if(m)return blank?'<span class="blank">？</span>':`<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`;
    m=t.match(/^([^\[\]]+)\[([^\]]+)\]$/);if(!m)return esc(t);const prefix=/^[おご]/.test(m[1])&&!m[2].startsWith(m[1][0])?m[1][0]:'';return `${esc(prefix)}<ruby>${esc(prefix?m[1].slice(1):m[1])}<rt>${esc(m[2])}</rt></ruby>`;}).join('');
}
function speechText(text){return String(text).replace(/\{[^|}]+\|([^}]+)\}/g,'$1').replace(/((?:お|ご)?[\u3400-\u9fff々〆ヵヶ][\u3400-\u9fff々〆ヵヶぁ-ゖ]*)\[([^\]]+)\]/g,(_,base,reading)=>(/^[おご]/.test(base)&&!reading.startsWith(base[0])?base[0]:'')+reading);}
function illustrationHtml(q){
  if(!q.image_url)return '';
  let url;try{url=new URL(q.image_url);if(url.protocol!=='https:')return '';}catch(e){return '';}
  return `<figure class="question-illustration"><img src="${esc(url.href)}" alt="${esc(q.image_alt||'題目示意圖')}" referrerpolicy="no-referrer"><figcaption>示意圖 · 答題參考（圖片未載入時可繼續作答）</figcaption></figure>`;
}

    <div class="quiz-top"><button class="text-link" data-action="home">← 暫停練習</button><span class="tag ${q.overdue&&!q.round?'amber':''}">${q.round?'重練':q.overdue?'重新複習':q.wasNew?'新單字':'複習'} · ${esc(labels[q.mode])}</span><span>${done} / ${session.total}</span></div>

    <div class="sentence">${reading?esc(q.answer):listening&&!feedback?'<span class="listening-symbol">♫</span>':sentenceHtml(q.sentence,!feedback)}</div>${listening&&!feedback?button('無法播放？改用文字練習','text-fallback','ghost small'):''}${q.assistedAudio?'<small>已切換文字練習，記為提示</small>':''}${q.hint?`<p class="word-hint"><span>提示</span>${esc(q.hint)}</p>`:''}${illustrationHtml(q)}</section>
    <form id="answer-form" class="quiz-answer"><label class="answer-label" for="answer-input">${feedback?'你的答案':reading?'輸入假名':'輸入日文（漢字或假名）'}</label>
    <input id="answer-input" class="answer-input ${feedback?.correct?'correct':''}" type="text" lang="ja" autocomplete="off" spellcheck="false" enterkeyhint="${feedback?'next':'done'}" placeholder="${feedback?'已記錄，按下一步繼續':'在這裡輸入答案…'}" value="${esc(feedback?state.submittedAnswer||'':state.draft.answer||'')}" aria-busy="${!!state.draft.pending}">
    <div id="answer-status" class="answer-status" role="status">${feedback?'已儲存這次作答':state.draft.pending?'正在儲存…':'答對會自動送出，不限修改次數。'}</div></form>
    <section class="quiz-help ${feedback?'is-feedback':''}" aria-live="polite">
      ${feedback?`<div class="feedback-title"><strong>${feedback.correct?'✓ 答對了！':'這題先記起來'}</strong><span>${feedback.xp?'+'+feedback.xp+' XP':'重練完成'}</span></div>${feedback.first&&feedback.nextReview>Date.now()?`<p class="learned-note">下次複習：${when(feedback.nextReview)}</p>`:''}<p class="answer">${esc(feedback.answer)} <small>（${esc(feedback.reading)}）</small></p><p>${esc(feedback.explanation)}</p><p class="muted">${zhHtml(q.translation)}</p>${reportHtml(q)}`:hints?`<div class="eyebrow">提示 ${hints} / 2</div><p>讀音開頭是「<strong>${esc(Array.from(q.reading)[0])}</strong>」。</p>${hints===2?'<p class="muted">已朗讀完整句子，試著回想答案。</p>':''}`:'<p class="muted">先試著回想。需要幫忙時，這裡會顯示提示與解答。</p>'}
    </section>
    <div class="quiz-controls">${feedback?button(feedback.completed?'查看成果 →':'下一題 →','next','full'):button(hints===0?'提示 1 · 首個假名':hints===1?'提示 2 · 朗讀整句':'看解答',hints>=2?'reveal':'hint','secondary full',state.draft.pending?'disabled':'')}</div>
  </div>`;

function reportHtml(q){
  if(state.reportedId===q.id)return '<p class="note">已收到回報，謝謝。</p>';
  if(!state.reporting)return '<button class="text-link report-link" data-action="report-open">回報這題有問題</button>';
  return `<div class="report-form"><label class="answer-label" for="report-category">哪裡有問題？</label><select id="report-category">${options({sentence:'例句有誤',translation:'翻譯有誤',answer:'答案或讀音有誤',ambiguous:'有其他也說得通的答案',other:'其他'},'sentence')}</select><label class="answer-label" for="report-note">補充說明（選填）</label><textarea id="report-note" maxlength="1000" rows="2"></textarea><div class="actions">${button('送出回報','report-send','secondary small')}${button('取消','report-cancel','ghost small')}</div></div>`;
}
async function sendReport(){const q=state.answeredQuestion;if(!q)return;const report={word_id:q.wordId,word:q.word,sentence:q.sentence,translation:q.translation,category:$('report-category').value,note:$('report-note').value.trim().slice(0,1000)};await task(async()=>{await api('reportProblem',report);state.reporting=false;state.reportedId=q.id;render();notify('已收到回報，連線時會送到雲端。');});}
async function start(kind,newRound=false){const requestId=uid();await task(async()=>{const s=await api(newRound?'startNewSession':'startSession',kind||'daily',requestId);if(!s.total){notify('目前沒有符合條件的題目。可以換個主題，或等到複習時間再回來。');return;}state.session=s;state.data.active=s;state.feedback=null;state.page='quiz';loadDraft();render();if(s.queue[s.index]?.mode==='listening')speak(speechText(s.queue[s.index].sentence));if(state.draft.pending){notify('找到尚未確認的作答，正在恢復。');setTimeout(()=>submitPending(),0);}});}
function normalizeAnswer(value){return String(value||'').normalize('NFKC').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s\u3000]/g,'').toLowerCase();}
function acceptedAnswers(q){return [...new Set((q.mode==='reading'?[q.reading].concat((q.aliases||[]).filter(a=>/^[\u3040-\u30ff]+$/.test(a))):[q.answer,q.reading].concat(q.aliases||[])).map(normalizeAnswer))];}
function closeAnswerHint(value,answers){
  const input=Array.from(normalizeAnswer(value));if(!input.length)return '';
  for(const answer of answers){
    const target=Array.from(answer);if(target.length<2||Math.abs(target.length-input.length)>1)continue;
    let i=0;while(i<Math.min(input.length,target.length)&&input[i]===target[i])i++;
    if(target.length===input.length+1&&input.slice(i).join('')===target.slice(i+1).join(''))return '很接近了，再確認讀音是否完整。';
    if(input.length===target.length+1&&input.slice(i+1).join('')===target.slice(i).join(''))return '很接近了，再檢查一下字數。';
    if(input.length===target.length&&i<target.length){
      if(input.slice(i+1).join('')===target.slice(i+1).join(''))return '很接近了，注意假名的大小、清濁音或字形。';
      if(i+1<target.length&&input[i]===target[i+1]&&input[i+1]===target[i]&&input.slice(i+2).join('')===target.slice(i+2).join(''))return '很接近了，再確認字的順序。';
    }
  }
  return '';
}
function answerStatus(text,kind=''){const status=$('answer-status');if(status){status.textContent=text;status.className='answer-status '+kind;}const input=$('answer-input');if(input){input.classList.toggle('correct',kind==='correct');}}
async function checkLiveAnswer(){
  if(state.page!=='quiz'||state.busy||state.feedback||state.draft.pending||state.composing)return;
  const q=state.session?.queue[state.session.index],input=$('answer-input');if(!q||!input)return;
  clearTimeout(state.liveHintTimer);
  state.draft.answer=input.value;saveDraft();
  const value=normalizeAnswer(input.value),answers=acceptedAnswers(q);
  if(!value){answerStatus('可以不限次修改，答對會自動送出。');return;}
  if(answers.includes(value)){answerStatus('答對了！正在送出…','correct');await submitAnswer();return;}
  const near=closeAnswerHint(value,answers);
  answerStatus('還沒答對，可以繼續修改。','near');
  if(near){const draftKey=state.draft.key;state.liveHintTimer=setTimeout(()=>{
    if(state.page!=='quiz'||state.composing||state.busy||state.feedback||state.draft.pending||state.draft.key!==draftKey||normalizeAnswer($('answer-input')?.value)!==value)return;
    state.draft.autoHint=true;saveDraft();answerStatus(near,'near');
  },450);}
}
async function hint(){
  if(state.busy||state.draft.pending||state.feedback||state.composing||(state.draft.hints||0)>=2)return;
  const q=state.session.queue[state.session.index];
  state.keepKeyboard=window.innerWidth<=600&&document.activeElement===$('answer-input')||state.keepKeyboard;
  state.draft.answer=$('answer-input')?.value??state.draft.answer??'';
  state.draft.hints=Math.min(2,(state.draft.hints||0)+1);
  if(state.draft.hints===2)state.draft.assistedAudio=true;
  saveDraft();render();
  if(state.draft.hints===2)speak(speechText(q.sentence));
}
async function revealAnswer(){
  if(state.busy||state.draft.pending||state.feedback)return;
  state.draft.answer=$('answer-input')?.value||'';
  state.draft.hints=3;state.draft.revealed=true;saveDraft();await submitAnswer();
}
async function submitAnswer(){
  if(state.busy||state.feedback||state.composing)return;
  const q=state.session.queue[state.session.index],value=$('answer-input')?.value??state.draft.answer??'';
  const abandoned=(state.draft.hints||0)>=3;
  if(!state.draft.pending&&!abandoned&&!acceptedAnswers(q).includes(normalizeAnswer(value))){
    const near=closeAnswerHint(value,acceptedAnswers(q));if(near)state.draft.autoHint=true;
    state.draft.answer=value;saveDraft();answerStatus(near||(value.trim()?'還沒答對，可以繼續修改。':'可以不限次修改，答對會自動送出。'),'near');return;
  }
  if(!state.draft.pending){state.draft.answer=value;state.draft.pending={eventId:uid(),questionId:q.id,answer:value,hints:state.draft.hints||0,revealed:abandoned,autoHint:!!state.draft.autoHint,assistedAudio:!!state.draft.assistedAudio};saveDraft();}
  const input=$('answer-input');if(input){state.keepKeyboard=true;input.setAttribute('aria-busy','true');}answerStatus('正在儲存…','correct');await submitPending();
}
async function submitPending(){await task(async()=>{const q=state.session.queue[state.session.index];const submittedAnswer=state.draft.pending.answer;const result=await api('answerQuestion',state.session.id,state.draft.pending);state.submittedAnswer=submittedAnswer;state.answeredQuestion=q;state.feedback=result.feedback;state.session=result.session;state.data=result.dashboard;state.draft={};saveDraft();render();speak(speechText(q.sentence));if(window.innerWidth>600)document.querySelector('[data-action="next"]')?.focus();},submitPending);}
function next(){window.speechSynthesis?.cancel();state.feedback=null;state.reporting=false;if(state.session.completedAt){state.page='summary';}else{loadDraft();state.page='quiz';}render();if(state.page==='quiz'&&state.session.queue[state.session.index]?.mode==='listening')speak(speechText(state.session.queue[state.session.index].sentence));}
function summaryView(){const s=state.session;if(!s)return '<div class="empty">完成一輪後就能看到成果。</div>';const scoredTotal=s.closedAt?Object.keys(s.results).length:s.total;const weak=Object.values(s.results).filter(r=>!r.correct);return `<div class="summary celebrate"><div class="summary-icon">✦</div><div class="eyebrow">A LITTLE BETTER, EVERY DAY</div><h1>${s.closedAt?'這一輪，已結束。':'這一輪，完成了。'}</h1><p class="muted">今天的每一次回想，都留下了紀錄。</p></div>

  <section class="panel"><p>無提示完成 ${s.firstCorrect} 題 · 提示後完成 ${s.assisted} 題 · 揭露答案 ${s.mistakes} 題</p><h3>${weak.length?'這幾個，再給它們一點時間。':'這輪都能獨立回答，很好！'}</h3>${weak.length?`<ul class="mini-list">${weak.map(w=>`<li>${esc(w.word)}（${esc(w.reading)}）<span class="tag">${esc(labels[w.mode])}</span></li>`).join('')}</ul><p class="muted">重練成功也會保留本輪原始紀錄；隔一段時間再答對，才代表記憶更穩定。</p>`:'<p class="muted">系統已安排間隔複習，下次會換個句子確認記憶。</p>'}</section>
  <section class="hero" style="margin-top:18px"><h2>你的下一步</h2><p class="muted">${state.data.due?'還有 '+state.data.due+' 題到期複習。':state.data.nextReview?'下一批複習在 '+when(state.data.nextReview)+'。':'可以更換主題，繼續探索。'}${state.data.available?'目前另有 '+state.data.available+' 題可安排。':''}</p><div class="actions">${button('完成今天，回首頁','home','')}${button('再練待加強','start','secondary','data-kind="weak" '+(!state.data.counts.weak?'disabled':''))}</div></section><p class="note">本頁是這一輪的成果，不代表全部題庫都已完成。每天完成一題就留下學習足跡；同日重練同字不重複計入目標。</p>`;}
function wordsView(){return `<div class="eyebrow">YOUR WORD COLLECTION</div><h1>一個字，一個新可能。</h1><p class="muted">${state.data.words.length} 個內容 · 收藏 ${state.data.favorites} 個</p><label class="answer-label" for="word-search">搜尋日文、假名或中文</label><input id="word-search" type="search" placeholder="搜尋單字、讀音或意思…" value="${esc(state.search)}"><div class="filter-row">${[['all','全部'],['favorites','☆ 收藏'],['weak','待加強'],['learning','熟悉中'],['new','未學習']].map(([k,v])=>`<button data-filter="${k}" class="${state.filter===k?'active':''}">${v}</button>`).join('')}</div><div class="panel" id="word-results">${wordRows()}</div>`;}
function wordRows(){const needle=state.search.trim().toLowerCase();const list=state.data.words.filter(w=>(state.filter==='all'||(state.filter==='favorites'?w.progress.favorite:w.status===state.filter))&&(!needle||[w.word,w.kana,w.meaning].some(t=>t.toLowerCase().includes(needle))));return list.length?list.map(w=>`<article class="word-row"><div><div class="between"><h3>${esc(w.word)}</h3><span class="tag ${w.status==='weak'?'amber':w.status==='learning'?'green':''}">${labels[w.status]}</span></div><div class="kana">${esc(w.kana)}</div><p>${esc(w.meaning)}</p><small>${esc(w.level)} · ${esc(topics[w.topic]||w.topic)}${w.progress.seen?' · 下次 '+when(w.progress.due):''}</small></div><div class="word-actions"><button class="icon-button ${w.progress.favorite?'selected':''}" data-favorite="${esc(w.id)}" aria-label="${w.progress.favorite?'取消收藏':'收藏'}${esc(w.word)}" aria-pressed="${w.progress.favorite}">${w.progress.favorite?'★':'☆'}</button><button class="icon-button" data-speak="${esc(w.id)}" aria-label="播放${esc(w.word)}的讀音">▶</button></div></article>`).join(''):'<div class="empty">沒有符合的內容，試試其他關鍵字或分類。</div>';}
function statsView(){const d=state.data,days=d.profile.days||[],week=Array.from({length:7},(_,i)=>day(Date.now()-(6-i)*86400000));return `<div class="eyebrow">PROGRESS THAT MEANS SOMETHING</div><h1>看見自己，慢慢變強。</h1><p class="muted">經驗值記錄投入，無提示回想記錄學習表現。</p><div class="grid"><div class="tile"><small>累積經驗值</small><strong>${d.profile.xp}</strong><small>XP</small></div><div class="tile"><small>無提示完成率</small><strong class="number-green">${d.accuracy===null?'—':d.accuracy+'%'}</strong><small>包含進行中的練習</small></div><div class="tile"><small>累積學習日</small><strong>${days.length}</strong><small>連續 ${d.streak} 天</small></div></div><section class="panel"><h3>隔天以後，還記得多少？</h3><p><strong style="font-size:28px;color:var(--green)">${d.reviewAccuracy===null?'—':d.reviewAccuracy+'%'}</strong> <span class="muted">跨日無提示回想率</span></p><p class="note">共 ${d.reviewTotal} 次跨日複習。當天反覆練習不計入，每題完成後更新。</p></section><section class="panel" style="margin-top:18px"><h3>最近七天的足跡 · ${week.filter(k=>days.includes(k)).length}／7 天</h3><div class="week">${week.map(dayKey=>`<div class="day ${days.includes(dayKey)?'done':''}">${dayKey.slice(5)}<span>${days.includes(dayKey)?'✓':'·'}</span></div>`).join('')}</div></section>
  <div class="section-label"><h2>每一種能力，都分開看</h2></div><div class="panel">${['recall','reading','listening','usage'].map(mode=>{const m=d.modes[mode]||{seen:0,correct:0};return `<div style="margin-bottom:18px"><div class="between"><span>${labels[mode]}</span><small>${m.seen?`${m.correct}／${m.seen} 次無提示完成`:'還沒有紀錄'}</small></div>${progress(m.seen?m.correct/m.seen*100:0)}</div>`;}).join('')}<p class="note">無提示完成允許修改答案，並不表示一次輸入就答對。提示後完成與揭露答案會分開記錄。這些數字不等同 JLPT 程度測驗。</p></div>
  <div class="section-label"><h2>記憶狀態</h2></div><div class="panel">${Object.entries(d.counts).map(([k,v])=>`<div class="between"><span>${labels[k]}</span><span>${v} 個</span></div>${progress(v/d.words.length*100)}`).join('')}<p class="note">學過但忘記會保留在「待加強」，不會變回未學習。複習間隔由 FSRS 依每個字的記憶狀況安排，記得越牢，間隔越長。</p></div>
  <div class="section-label"><h2>你的里程碑</h2></div><div class="badge-grid">${d.badges.map(b=>`<div class="badge ${b.unlocked?'':'locked'}"><div class="badge-icon">${b.icon}</div><strong>${esc(b.name)}</strong><small>${esc(b.detail)}</small><small>${b.unlocked?'已解鎖':'尚未解鎖'}</small></div>`).join('')}</div>
  <div class="section-label"><h2>最近練習</h2></div><div class="panel">${d.recent.length?d.recent.map(s=>`<div class="history-row"><span>${when(s.completedAt||s.closedAt)}<br><small>${s.closedAt?'已結束 · 已答 '+Object.keys(s.results).length+'/':''}${s.total} 題 · 新學 ${s.fresh} 題</small><br><button class="text-link" data-session="${esc(s.id)}">查看這輪成果</button></span><span>無提示完成 ${s.firstCorrect}／${s.closedAt?Object.keys(s.results).length:s.total}<br><small>+${s.xp} XP · ${Math.max(1,Math.round(((s.completedAt||s.closedAt)-s.startedAt)/60000))} 分鐘（含暫停）</small></span></div>`).join(''):'<div class="empty">完成第一輪，留下你的第一筆成長紀錄。</div>'}</div>`;}
function options(values,selected){return Object.entries(values).map(([v,label])=>`<option value="${esc(v)}" ${String(selected)===v?'selected':''}>${esc(label)}</option>`).join('');}
function settingsView(){const s=state.data.profile.settings,ratios={};for(let r=0;r<=100;r+=10)ratios[r]=r+'%';return `<div class="eyebrow">MAKE IT YOURS</div><h1>找到適合你的節奏。</h1><p class="muted">設定會套用到下一輪；進行中的練習可以繼續完成。每輪先安排到期複習，其中約兩成是逾期的「重新複習」，剩下的名額才給新字。</p><form id="settings-form" class="panel"><div class="grid two"><div class="field"><label for="setting-goal">每天想完成幾題？</label><select id="setting-goal">${options({10:'10 題',20:'20 題',30:'30 題',40:'40 題'},s.goal)}</select></div><div class="field"><label for="setting-new-ratio">新字比例</label><select id="setting-new-ratio">${options(ratios,s.newRatio)}</select><small>例如 20 題、新字 30%，就是最多 6 個新字；複習不夠時，空位會補新字。</small></div><div class="field"><label for="setting-level">新字的程度</label><select id="setting-level">${options({N5:'N5 · 基礎日文',N4:'N4 · 進階基礎',N3:'N3 · 中級日文',N2:'N2 · 中高級日文',all:'不限程度'},s.level)}</select><small>到期複習不受程度篩選限制。</small></div><div class="field"><label for="setting-mode">練習方式</label><select id="setting-mode">${options({recall:'句子回想'},'recall')}</select></div></div><div id="forecast-warning">${forecastHtml(window.epopCloud?.forecast(s))}</div><div class="field"><label for="setting-reminder">每日提醒時間（台北時間）</label><input id="setting-reminder" type="time" value="${esc(s.reminder)}" required><small>儲存後可下載行事曆提醒。網頁本身不會在背景發送通知。</small></div><button class="button" type="submit">儲存我的學習計畫</button></form>
  <section class="panel" style="margin-top:20px"><h3>讓明天的自己記得回來</h3><p class="muted">將每天的練習放進行事曆，匯入後可自行調整通知。</p>${button('下載每日提醒 .ics','calendar','secondary')}</section>
  <section class="panel" style="margin-top:20px"><h3>朗讀語音</h3><div class="field"><label for="setting-voice">日文語音（只套用在這台裝置）</label><select id="setting-voice">${voiceOptions()}</select><small>下載裝置的「增強版」或「高品質」日文語音後，會自動優先使用。沒看到新語音時，重新開啟 App。</small></div><div class="actions">${button('試聽','voice-test','secondary')}</div></section><section class="panel" style="margin-top:20px"><h3>版本與安裝</h3><div class="actions"><button data-action="install" class="button secondary">安裝到主畫面</button><button class="button ghost" data-action="check-update">檢查新版本</button></div></section><section class="panel" style="margin-top:20px"><h3>你的學習檔案</h3><p class="muted">已登入：${esc(window.epopCloud?.email()||'')}。作答會先存在這台裝置，連線時自動同步到雲端；離線也能練習，換裝置登入同一帳號即可接續。</p><p class="note">${esc(window.epopCloud?.status()||'')}</p><div class="actions">${button('立即同步','sync-now','secondary')}${button('登出帳號','cloud-logout','ghost')}</div></section><section class="panel" style="margin-top:20px"><h3>備份</h3><p class="muted">匯出包含學習進度、設定與所有作答紀錄。</p><div class="actions">${button('匯出進度 JSON','backup-export','secondary')}</div><p class="note">可加入主畫面；第一次開啟需要連線下載題庫，之後可離線練習。離線語音取決於裝置日文語音是否可用。</p></section>`;}

async function saveSettings(){const settings={goal:Number($('setting-goal').value),newRatio:Number($('setting-new-ratio').value),level:$('setting-level').value,topic:'all',mode:'recall',reminder:$('setting-reminder').value,onboarding:true};await task(async()=>{state.data=await api('updateSettings',settings);state.page='home';render();notify('計畫已儲存，下一輪會使用新的設定。');});}
// Downloaded enhanced/premium system voices sound far more natural than the defaults, so they are
// preferred automatically; a voice chosen in settings is remembered per device (voices differ by device).
function voiceQuality(v){const id=v.name+' '+v.voiceURI;return /premium/i.test(id)?2:/enhanced|高品質|增強|強化|拡張|neural|natural/i.test(id)?1:0;}
function japaneseVoices(){return(window.speechSynthesis?.getVoices()||[]).filter(v=>/^ja/i.test(v.lang)).sort((a,b)=>voiceQuality(b)-voiceQuality(a));}
function preferredVoice(){const voices=japaneseVoices(),chosen=readLocal('voice');return voices.find(v=>v.voiceURI===chosen)||voices[0];}
function voiceOptions(){const chosen=readLocal('voice'),voices=japaneseVoices();return `<option value="">自動（優先使用高品質語音）</option>`+voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===chosen?'selected':''}>${esc(v.name)}${['',' · 增強版',' · 高品質'][voiceQuality(v)]}</option>`).join('');}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{const el=$('setting-voice');if(el)el.innerHTML=voiceOptions();};
// iOS/Safari only allow speech after it has been started once inside a user gesture; the
// first tap or key press speaks a silent utterance so later automatic playback works.
let speechUnlocked=false;
function unlockSpeech(){if(speechUnlocked||!('speechSynthesis'in window))return;speechUnlocked=true;const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}
for(const type of ['pointerdown','keydown','touchend'])document.addEventListener(type,unlockSpeech,{capture:true});
function speak(text,slow=false){if(!('speechSynthesis'in window)){notify('此瀏覽器不支援語音播放，請改用回想或讀音模式。');return false;}speechUnlocked=true;const busy=speechSynthesis.speaking||speechSynthesis.pending;if(busy)speechSynthesis.cancel();if(speechSynthesis.paused)speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=slow?.75:.9;const voice=preferredVoice();if(voice)u.voice=voice;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))notify('語音播放失敗，請確認装置日文語音可用，或改用其他題型。');};
  // Keep a reference so the utterance is not garbage-collected mid-speech, and give the engine a
  // moment after cancel(): speaking immediately after cancel() is sometimes silently dropped.
  speak.current=u;if(busy)setTimeout(()=>{if(speak.current===u)speechSynthesis.speak(u);},80);else speechSynthesis.speak(u);return true;}
async function textFallback(){if(state.draft.pending)return;await task(async()=>{const q=state.session.queue[state.session.index];state.session=await api('switchToTextQuestion',state.session.id,q.id);state.data.active=state.session;state.draft.assistedAudio=true;saveDraft();render();notify('已切換為文字練習；這題不計入獨立回想或聽力成績。');});}
function audio(){const q=state.feedback?state.answeredQuestion:state.session?.queue[state.session.index];if(!q)return;if(!state.feedback&&q.mode!=='listening'){state.draft.assistedAudio=true;saveDraft();notify('已使用語音提示，這題會另外記錄。');}speak(speechText(q.sentence));}
function calendar(){const time=state.data.profile.settings.reminder;const d=new Date(Date.now()+8*3600000);let date=day();if(d.toISOString().slice(11,16)>=time)date=day(Date.now()+86400000);const stamp=date.replace(/-/g,'')+'T'+time.replace(':','')+'00';const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Japanese Epop//Learning Reminder//ZH','CALSCALE:GREGORIAN','BEGIN:VTIMEZONE','TZID:Asia/Taipei','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0800','TZOFFSETTO:+0800','TZNAME:CST','END:STANDARD','END:VTIMEZONE','BEGIN:VEVENT','UID:'+uid()+'@japanese-epop.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;TZID=Asia/Taipei:'+stamp,'DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:日日勉強日：每天一點，真的記住','DESCRIPTION:完成今天的日文練習與複習。','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:今天也學一點日文','END:VALARM','END:VEVENT','END:VCALENDAR'];const blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='日日勉強日_每日學習提醒.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('提醒已下載，請匯入你的行事曆。重複匯入可能產生重複提醒。');}
function downloadJson(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function exportBackup(){await task(async()=>{const backup=await api('exportLearningBackup');backup.draft=state.draft;downloadJson('日日勉強日-進度-'+day()+'.json',backup);notify('備份已匯出，請保留在安全的位置。');});}
function forecastHtml(f){if(!f)return '';return f.overloaded?`<div class="warning-panel" role="status"><strong>新字可能太多，複習會來不及</strong><p>預估未來 30 天平均每天約 ${f.average} 題到期複習，超過每日複習名額 ${f.reviewSlots} 題。建議降低新字比例，或提高每日題數。</p></div>`:`<p class="note">預估未來 30 天平均每天約 ${f.average} 題到期複習，每日複習名額 ${f.reviewSlots} 題，目前的步調來得及。</p>`;}
function settingsForecast(){const box=$('forecast-warning');if(!box||!window.epopCloud)return;box.innerHTML=forecastHtml(window.epopCloud.forecast({...state.data.profile.settings,goal:Number($('setting-goal').value),newRatio:Number($('setting-new-ratio').value),level:$('setting-level').value}));}
document.addEventListener('change',e=>{if(['setting-goal','setting-new-ratio','setting-level'].includes(e.target.id))settingsForecast();if(e.target.id==='setting-voice'){writeLocal('voice',e.target.value);speak(VOICE_SAMPLE);}});
const VOICE_SAMPLE='毎日少しずつ日本語を勉強しています。';
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return;}const b=e.target.closest('button');if(!b||b.disabled||state.busy)return;
  if(b.dataset.session){const session=state.data.recent.find(s=>s.id===b.dataset.session);if(session){state.session=session;go('summary');}return;}
  if(b.dataset.filter){state.filter=b.dataset.filter;render();return;}
  if(b.dataset.favorite){task(async()=>{state.data=await api('toggleFavorite',b.dataset.favorite);render();});return;}
  if(b.dataset.speak){const word=state.data.words.find(w=>w.id===b.dataset.speak);if(word)speak(word.kana);return;}
  const action=b.dataset.action;if(action==='check-update'){window.epopUpdates?.check();return;}if(action==='install'){window.epopUpdates?.install();return;}if(action==='reveal'){revealAnswer();return;}if(action==='cloud-logout'){task(()=>window.epopCloud.logout());return;}if(action==='backup-export'){exportBackup();return;}if(action==='voice-test'){speak(VOICE_SAMPLE);return;}if(action==='sync-now'){task(async()=>{state.data=await api('syncNow');render();notify(window.epopCloud?.status()||'已同步');});return;}if(action==='report-open'){state.reporting=true;render();document.querySelector('.report-form')?.scrollIntoView?.({block:'nearest'});return;}if(action==='report-cancel'){state.reporting=false;render();return;}if(action==='report-send'){sendReport();return;}if(['home','words','stats','settings','summary'].includes(action)){go(action);return;}
  if(action==='start-new')start(b.dataset.kind,true);else if(action==='start')start(b.dataset.kind);else if(action==='hint')hint();else if(action==='next')next();else if(action==='audio')audio();else if(action==='text-fallback')textFallback();else if(action==='calendar')calendar();
});
document.addEventListener('pointerdown',e=>{
  const action=e.target.closest?.('[data-action]')?.dataset.action;
  if(state.page==='quiz'&&['hint','reveal','next'].includes(action)&&document.activeElement===$('answer-input')){state.keepKeyboard=true;e.preventDefault();}
});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();if(!state.composing){if(state.feedback)next();else submitAnswer();}}if(e.target.id==='settings-form'){e.preventDefault();saveSettings();}});
document.addEventListener('compositionstart',e=>{if(e.target.id==='answer-input'){state.composing=true;clearTimeout(state.liveHintTimer);}});
document.addEventListener('compositionend',e=>{if(e.target.id!=='answer-input')return;setTimeout(()=>{state.composing=false;if(state.page==='quiz'&&$('answer-input')===e.target)checkLiveAnswer();},0);});
document.addEventListener('keydown',e=>{if(e.target.id==='next-input'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();if(!state.busy)next();return;}if(e.target.id==='answer-input'&&e.key==='Enter'&&(e.isComposing||state.composing||e.keyCode===229)){e.preventDefault();}});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){state.search=e.target.value;$('word-results').innerHTML=wordRows();}if(e.target.id==='answer-input'&&!state.feedback&&!state.draft.pending){state.draft.answer=e.target.value;saveDraft();if(!e.isComposing&&!state.composing)return checkLiveAnswer();}});
document.addEventListener('DOMContentLoaded',()=>{$('retry-button').onclick=()=>state.retry?.();document.querySelector('.brand').onclick=e=>{e.preventDefault();go('home');};if(window.epopCloud)window.epopCloud.onChange=async()=>{if(state.busy||!state.data||['quiz','summary'].includes(state.page))return;state.data=await api('getDashboard');render();};if(!state.storage)notify('瀏覽器阻擋儲存，關閉頁面後可能無法取回此學習檔案。');task(async()=>{if(window.epopCloud&&!await window.epopCloud.init())return;state.data=await api('getDashboard');render();});});
</script>
